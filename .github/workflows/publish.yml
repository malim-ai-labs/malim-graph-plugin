name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build hatchling
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  package-skills:
    name: Package Claude Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zip
        run: sudo apt-get install -y zip
      - name: Package skill — pdf-to-knowledge-graph
        run: |
          mkdir -p dist
          cd skills/pdf-to-knowledge-graph
          zip -r ../../dist/pdf-to-knowledge-graph.skill SKILL.md scripts/
      - name: Package skill — pdf-to-chunks
        run: |
          cd skills/pdf-to-chunks
          zip -r ../../dist/pdf-to-chunks.skill SKILL.md scripts/
      - name: Package skill — document-to-html
        run: |
          cd skills/document-to-html
          zip -r ../../dist/document-to-html.skill SKILL.md scripts/
      - name: Package skill — graph-db-admin
        run: |
          cd skills/graph-db-admin
          zip -r ../../dist/graph-db-admin.skill SKILL.md scripts/
      - name: Upload skills to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pdf-to-knowledge-graph.skill
            dist/pdf-to-chunks.skill
            dist/document-to-html.skill
            dist/graph-db-admin.skill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
