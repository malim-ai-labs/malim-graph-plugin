                size: 10,
                label: ent.label,
                color: colorPalette[type] || defaultColor,
                type: type,

                sourceText: ent.source_text || "N/A",
                sourcePages: (ent.source_pages || []).join(", ")

        graphData.relationships.forEach((rel) => {

                    label: rel.type,
                    size: 1,
                    color: "#334155"
                });
