services:
  - type: web
    name: malimgraph
    runtime: python
    buildCommand: pip install malimgraph
    startCommand: malimgraph-plugin --transport http --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MALIMGRAPH_TRANSPORT
        value: http
      - key: PYTHONUNBUFFERED
        value: "1"
      # Add your optional env vars in the Render dashboard:
      # OPENAI_API_KEY      — for OpenAI embeddings
      # VOYAGE_API_KEY      — for Voyage AI embeddings
      # PGVECTOR_URI        — for pgvector storage
      # NEO4J_URI           — for Neo4j
      # NEO4J_USER
      # NEO4J_PASSWORD
      # AGE_CONNECTION_URI  — for Apache AGE
