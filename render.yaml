services:
  - type: web
    name: malimgraph
    runtime: python
    buildCommand: pip install -e .
    startCommand: malimgraph-plugin --transport http --port $PORT
    envVars:
      - key: MALIMGRAPH_TRANSPORT
        value: http
      - key: PYTHONUNBUFFERED
        value: "1"
      # Add these in the Render dashboard as needed:
      # OPENAI_API_KEY      — OpenAI embeddings
      # VOYAGE_API_KEY      — Voyage AI embeddings
      # PGVECTOR_URI        — pgvector storage
      # NEO4J_URI           — Neo4j
      # NEO4J_USER
      # NEO4J_PASSWORD
      # AGE_CONNECTION_URI  — Apache AGE
